name: Build with MSYS2

on:
  push:
    branches:
      - dev-editor
  pull_request:
    branches:
      - dev-editor

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >
          mingw-w64-i686-toolchain
          mingw-w64-i686-allegro
          make

    - name: Add MSYS2 to PATH
      run: echo "C:\\msys64\\mingw32\\bin" >> $GITHUB_PATH
      
    - name: List files for debugging
      run: ls -R Clases/GUI

    - name: Build with make in Clases/GUI
      shell: bash
      run: |
        cd Clases/GUI
        make



